[package]
name = "soundboard"
version = "1.13.0"
edition = "2021"
rust-version = "1.89"
authors = ["jj-repository", "arabian (upstream)"]
description = "Soundboard for Windows: routes audio files through a virtual microphone. Single binary with embedded daemon + optional CLI subcommand."
readme = "README.md"
repository = "https://github.com/jj-repository/soundboard"
license = "MIT"
keywords = ["soundboard", "soundpad", "audio", "cli", "gui", "windows"]


[dependencies]
tokio = { version = "1.51.0", features = ["full"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

clap = { version = "4.6.0", default-features = false, features = ["std", "suggestions", "help", "usage", "error-context", "derive"] }
dirs = "6.0.0"

rodio = { version = "0.22.2", default-features = false, features = ["symphonia-all", "playback"] }
rfd = "0.17.2"

egui = { version = "0.34.1", default-features = false, features = ["default_fonts", "rayon"] }
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_material_icons = "0.6.0"

image = { version = "0.25", default-features = false, features = ["png"] }
global-hotkey = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1.0"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

tray-icon = "0.22"
muda = "0.17"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
# MIDI input (note-on events) and gamepad input (button-press events) for
# alternate hotkey bindings beyond keyboard/global hotkeys.
midir = "0.10"
gilrs = "0.11"
# WAV writer for the toggle-recorder (mic + system-loopback capture).
hound = "3"
# Lock-free SPSC ring buffer for mic passthrough. Avoids locking the audio
# callback against the playback thread at 48 kHz.
ringbuf = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
